services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chopits-api
    restart: unless-stopped
    ports:
      # Falha imediatamente se API_PORT não estiver configurada no .env
      - "${API_PORT:?Erro: Variavel de ambiente API_PORT obrigatoria ausente no .env}:3001"
    volumes:
      # Persistência bidirecional: alterações no banco mock persistem no host
      - ./jsonserver/dados.json:/app/jsonserver/dados.json
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/usuarios"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - chopits-network

  frontend:
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:?Erro: Variavel de ambiente VITE_API_BASE_URL obrigatoria ausente no .env}"
    container_name: chopits-frontend
    restart: unless-stopped
    ports:
      # Falha imediatamente se FRONTEND_PORT não estiver configurada no .env
      - "${FRONTEND_PORT:?Erro: Variavel de ambiente FRONTEND_PORT obrigatoria ausente no .env}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chopits-network

networks:
  chopits-network:
    driver: bridge
