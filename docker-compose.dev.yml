services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chopits-api-dev
    ports:
      - "${API_PORT:-3002}:3001"
    volumes:
      - ./jsonserver/dados.json:/app/jsonserver/dados.json
    environment:
      - NODE_ENV=development
      - PORT=3001
    networks:
      - chopits-dev-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: chopits-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_PORT=${API_PORT:-3002}
    depends_on:
      - api
    networks:
      - chopits-dev-network

networks:
  chopits-dev-network:
    driver: bridge
