services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chopits-api-dev
    ports:
      - "${API_PORT:?Erro: Variavel de ambiente API_PORT obrigatoria ausente no .env}:3001"
    volumes:
      - ./jsonserver/dados.json:/app/jsonserver/dados.json
    environment:
      - NODE_ENV=development
      - PORT=3001
    networks:
      - chopits-dev-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: chopits-frontend-dev
    ports:
      - "${FRONTEND_PORT:?Erro: Variavel de ambiente FRONTEND_PORT obrigatoria ausente no .env}:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    environment:
      - "VITE_API_BASE_URL=${VITE_API_BASE_URL:?Erro: Variavel de ambiente VITE_API_BASE_URL obrigatoria ausente no .env}"
    depends_on:
      - api
    networks:
      - chopits-dev-network

networks:
  chopits-dev-network:
    driver: bridge
