name: CI - Lint, Build & Docker Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality:
    name: Lint & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Linter (ESLint)
        run: npm run lint

      - name: Validar Compilação TypeScript e Build Vite
        run: npm run build

  docker-validation:
    name: Validação de Containers Docker
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Sintaxe do Docker Compose
        run: |
          docker compose config
          docker compose -f docker-compose.dev.yml config

      - name: Compilar Imagens Docker (Produção)
        run: docker compose build
